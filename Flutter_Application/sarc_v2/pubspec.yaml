name: sarc
description: SARC - community-facing mobile app for river-corridor monitoring.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter        # Hindi / Nepali strings for built-in Material widgets
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0 # Google Maps (API key in AndroidManifest.xml)
  url_launcher: ^6.3.0       # "Call" buttons on the Emergency screen
  shared_preferences: ^2.3.0 # remembers onboarding, theme and language

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
