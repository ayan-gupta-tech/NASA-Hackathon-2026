name: sarc
description: SARC - community-facing mobile app (V1 frontend demo, mock data).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0 # Google Maps (API key in AndroidManifest.xml)
  latlong2: ^0.9.1           # coordinates used by the data/models
  url_launcher: ^6.3.0       # "Call" buttons on the Emergency screen
  shared_preferences: ^2.3.0 # remembers that onboarding was completed

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
